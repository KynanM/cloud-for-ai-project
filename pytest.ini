[pytest]
pythonpath = .
testpaths = tests
markers =
    traag: duurt langer dan een paar seconden (training, MLflow, API, opdrachtregel). Snel: pytest -m "not traag"
    deel3: API, monitoring, publiceren, tracking en de performancegate. Alleen deel 2: pytest -m "not deel3"
# Twee meldingen uit externe pakketten, niet uit deze code. Ze verdwijnen pas met andere versies,
# en de versies in de lockfiles liggen vast:
# - Starlette wil httpx2 in plaats van httpx voor de TestClient
# - MLflow gebruikt een SQLAlchemy-optie die later verdwijnt
filterwarnings =
    ignore:Using .httpx. with .starlette\.testclient. is deprecated
    ignore:The ..noload.. loader strategy is deprecated

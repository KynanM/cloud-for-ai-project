name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: file:./mlruns
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: ruff check . && ruff format --check .
      - run: python -m src.train
      - run: pytest -q
      - run: python -m benchmarks.workloads --alleen smoke,normaal
      - run: python -m benchmarks.gate
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: resultaten
          path: |
            resultaten/software/gate.json
            logs/

  notebook:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: python -m src.train
      - run: jupyter nbconvert --to notebook --execute notebooks/01_exploratie.ipynb --output /tmp/nb.ipynb

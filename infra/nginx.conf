# Horizontaal schalen (les 06 p. 19): dezelfde container N keer, nginx verdeelt de verzoeken.
# De DNS van Docker geeft voor "api" alle containers terug; nginx herleest ze elke 5 seconden.
events {}
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream api {
    zone api 64k;
    server api:7860 resolve;
  }
  server {
    listen 8080;
    client_max_body_size 200m;
    location / {
      proxy_pass http://api;
      proxy_read_timeout 120s;
    }
  }
}

# Alles wat je zou willen veranderen zonder code aan te raken, staat hier.
# Paden zijn relatief ten opzichte van de projectmap.

data:
  # Hotel booking demand (Antonio, Almeida & Nunes, 2019), van Kaggle. Zie de README.
  pad: data/hotel_bookings.csv
  voorbeeld: data/nieuwe_boekingen.csv

# Het label wordt afgeleid, het staat niet als kolom in de csv. Zie maak_label() in src/data.py.
doel: annuleert_na_beslismoment

label:
  # Het beslismoment: zoveel dagen vóór de aankomst beslist de revenue manager.
  horizon_dagen: 30

opschoning:
  # Buiten scope (deel 1): Non Refund is een bekende datafout, 99 % ervan staat als geannuleerd.
  uitgesloten_deposit: Non Refund
  # adr in euro per nacht. Nul of negatief is geen echte verkoop, 1000 of meer is een tikfout.
  adr_min: 0
  adr_max: 1000

features:
  numeriek:
    - lead_time
    - stays_in_weekend_nights
    - stays_in_week_nights
    - adults
    - children
    - babies
    - is_repeated_guest
    - previous_cancellations
    - previous_bookings_not_canceled
    - adr
  categorisch:
    - hotel
    - arrival_date_month
    - meal
    - market_segment
    - distribution_channel
    - reserved_room_type
    - deposit_type
    - customer_type
    - agent
  # Bewust niet: reservation_status(_date) is het label zelf; assigned_room_type,
  # booking_changes, days_in_waiting_list, required_car_parking_spaces en
  # total_of_special_requests zijn pas na het beslismoment gekend (lek).
  # Het land, gegroepeerd tot PRT tegenover de rest, in de pijplijn (land_als_groep in
  # src/train.py). false: het model met en zonder land vergelijken is deze ene sleutel.
  gebruik_land: true

# Een split in de tijd, op aankomstdatum. Een willekeurige split laat de toekomst in de
# training lekken. Begin en einde zijn inbegrepen.
#   training     alles met aankomst vóór het embargo voor de validatie (tot 30-11-2016)
#   validatie    hier kies je het model, de drempels en later de ijking
#   hertraining  alles met aankomst vóór het embargo voor de test (tot 28-02-2017)
#   test         één keer meten, met het hertrainde model. Hier kies je niets
# Het embargo rekent src/train.py uit: horizon_dagen + 1 dag vóór het eerste beslismoment.
split:
  validatie_start: 2017-01-01
  validatie_einde: 2017-03-31
  test_start: 2017-04-01
  test_einde: 2017-08-31

# De baseline: wat de revenue manager vandaag doet. Zie src/baseline.py.
vuistregel:
  # Alleen het laatste jaar vóór het einde van de training. null: alle historiek.
  venster_maanden: 12
  # Klassen van lead_time in dagen: <60, 60–120, 120–240, 240+. Actief op T is minstens 30.
  lead_time_grenzen: [60, 120, 240]
  # Een groep met minder boekingen krijgt het percentage van het hotel.
  minimum_groep: 30

model:
  # vuistregel | logreg | boosting. Gekozen op de validatie, nooit op de test.
  soort: logreg
  pad: models/model.joblib
  # Voor het toeval in boosting. Zelfde seed, zelfde model.
  seed: 42
  logreg:
    max_iter: 1000
  boosting:
    max_iter: 200
    learning_rate: 0.05
    max_leaf_nodes: 15
    min_samples_leaf: 100
    l2_regularization: 1.0
  # Een model dat op de validatie slechter doet dan dit, mag niet naar productie. Met de split
  # in de tijd haalt de logistische regressie 0,63. Zie de README.
  minimum_auc: 0.60

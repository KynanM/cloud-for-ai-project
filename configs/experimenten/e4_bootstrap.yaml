# Taak 3.5 (E4). Vastgelegd vóór de meting.
hypothese: >
  Hotel-nachten zijn niet onafhankelijk (lange verblijven, groepen, seizoen). Losse nachten
  hertrekken geeft dan te smalle intervallen; met blokken van dagen worden ze breder.
baseline: "huidige bootstrap: losse hotel-nachten (bootstrap() in src/onderzoek/experimenten.py)"
alternatieven: ["blokken van 1, 7, 14 en 28 kalenderdagen, beide hotels gepaard"]
metrics:
  ml: "Δ MAE per nacht: 200 tegenover 100 iteraties, logreg en vuistregel tegenover boosting"
  software: "n.v.t."
  business: "Δ € per volle nacht: zekerheid 0,725 tegenover 0,80"
beslisregel: >
  Een conclusie 'aantoonbaar' blijft alleen staan als het 90 %-interval bij blokken van 7 én 14
  dagen aan dezelfde kant van 0 blijft. Valt '100 iteraties is beter dan 200' om, dan blijft 100
  iteraties staan met een andere reden: niet slechter, en sneller en kleiner (softwaremetriek).

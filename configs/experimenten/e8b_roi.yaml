# De ROI-raming (src.onderzoek.business roi). Vastgelegd vóór de berekening.
hypothese: >
  De meerwaarde van boosting tegenover de vuistregel per volle nacht, maal het aantal volle nachten
  per maand, is groter dan de kosten van infrastructuur en beheer.
baseline: "de vuistregel van de revenue manager (geen modelkosten)"
alternatieven: ["boosting, met infrastructuur- en beheerkosten"]
metrics:
  ml: "n.v.t."
  software: "infrastructuurkosten per maand (resultaten/serving/kosten.csv)"
  business: "netto € per maand en terugverdientijd in een pessimistisch, basis- en optimistisch scenario"
beslisregel: >
  Beschrijvend. Elke invoer is gelabeld als gemeten, geraamd of aangenomen. Een ROI-claim in de
  README alleen met de scenario-aanduiding.
